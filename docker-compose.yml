services:
  mongodb:
    image: mongo:7
    container_name: tindahan-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: tindahan_db
      MONGO_REPLICA_SET_NAME: rs0
    volumes:
      - mongo-data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      - ./scripts/mongo-keyfile:/data/mongo-keyfile:ro
    command: >
      bash -c '
        cp /data/mongo-keyfile /tmp/mongo-keyfile &&
        chmod 400 /tmp/mongo-keyfile &&
        mongod --replSet rs0 --bind_ip_all --keyFile /tmp/mongo-keyfile --auth
      '
    healthcheck:
      test: mongosh --eval "rs.status().ok || rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  mongo-data:
