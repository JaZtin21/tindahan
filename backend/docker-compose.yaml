version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: tindahan-mongodb
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: tindahan_db
    volumes:
      - mongodb_data:/data/db
    networks:
      - tindahan-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh admin -u admin -p password --quiet || echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

  tindahan-api:
    build: .
    container_name: tindahan-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MONGO_URI: mongodb://admin:password@mongodb:27017/?replicaSet=rs0&authSource=admin
      MONGO_DB_NAME: tindahan_db
      JWT_SECRET: tindahan-super-secret-jwt-key-change-in-production
      SERVER_PORT: 8080
    depends_on:
      - mongodb
    networks:
      - tindahan-network
    volumes:
      - .:/app
    working_dir: /app

volumes:
  mongodb_data:

networks:
  tindahan-network:
    driver: bridge
