# User Schema - User Management

extend type Query {
  users(page: Int, limit: Int): [User!]!
}

extend type Mutation {
  updateProfile(input: UpdateProfileInput!): UserPayload
  createUser(input: CreateUserInput!): UserPayload!
  deleteUser(id: ObjectID!): DeletePayload!
  updateUserStatus(id: ObjectID!, isActive: Boolean!): UserPayload!
  uploadProfilePhoto(file: Upload!): UserPayload!
  uploadCoverPhoto(file: Upload!): UserPayload!
  followUser(userId: ObjectID!): UserPayload!
  unfollowUser(userId: ObjectID!): UserPayload!
}

extend type Query {
  user(id: ObjectID!): User
  followers(userId: ObjectID!): [User!]!
  following(userId: ObjectID!): [User!]!
  usersByIds(ids: [ObjectID!]!): [User!]!
}

input CreateUserInput {
  firstName: String!
  lastName: String!
  email: String!
  password: String!
  role: UserRole!
}

type DeletePayload {
  success: Boolean!
  message: String!
}
