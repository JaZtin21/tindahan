# Auth Schema - Authentication & Authorization

extend type Query {
  me: UserPayload
  health: String!
}

extend type Mutation {
  login(input: LoginInput!): AuthPayload!
  signup(input: SignupInput!): AuthPayload!
  refreshToken(input: RefreshTokenInput!): AuthPayload!
  googleLogin(input: GoogleLoginInput!): AuthPayload!
}

type User {
  id: ObjectID!
  name: String!
  email: String!
  firstName: String!
  lastName: String!
  role: UserRole!
  phone: String
  birthday: String
  profilePhoto: String
  coverPhoto: String
  shops: [ObjectID!]
  createdAt: Time!
  updatedAt: Time
  isActive: Boolean!
}

type AuthResponse {
  user: User!
  accessToken: String!
  refreshToken: String!
}

type AuthPayload {
  success: Boolean!
  message: String!
  data: AuthResponse
}

type UserPayload {
  success: Boolean!
  message: String!
  data: User
}

input LoginInput {
  email: String!
  password: String!
}

input SignupInput {
  firstName: String!
  lastName: String!
  email: String!
  password: String!
  role: UserRole
}

input RefreshTokenInput {
  refreshToken: String!
}

input GoogleLoginInput {
  credential: String!
  role: UserRole
}

input UpdateProfileInput {
  firstName: String
  lastName: String
  phone: String
  birthday: String
}
