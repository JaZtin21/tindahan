# Post Schema - User Posts and Comments

extend type Query {
  posts(page: Int, limit: Int): PostsPayload
  post(id: ObjectID!): PostPayload
  myPosts(page: Int, limit: Int): PostsPayload
  userPosts(userId: ObjectID!, page: Int, limit: Int): PostsPayload
  postsNearLocation(lat: Float!, lng: Float!, radius: Float, page: Int, limit: Int): PostsPayload
  comments(postId: ObjectID!, page: Int, limit: Int): CommentsPayload
}

extend type Mutation {
  createPost(input: CreatePostInput!): PostPayload!
  updatePost(id: ObjectID!, input: UpdatePostInput!): PostPayload!
  deletePost(id: ObjectID!): DeletePayload!
  likePost(id: ObjectID!): PostPayload!
  unlikePost(id: ObjectID!): PostPayload!
  addComment(postId: ObjectID!, text: String!): CommentPayload!
  deleteComment(commentId: ObjectID!, postId: ObjectID!): DeletePayload!
  uploadImage(file: Upload!, folder: String): ImageUploadPayload!
}

type Post {
  id: ObjectID!
  title: String!
  text: String!
  photos: [String!]!
  types: [String!]!
  author: User!
  location: Location
  likes: Int!
  isLiked: Boolean!
  comments: [Comment!]!
  commentCount: Int!
  createdAt: Time!
  updatedAt: Time
}

type Comment {
  id: ObjectID!
  text: String!
  author: User!
  createdAt: Time!
  updatedAt: Time
}

type Location {
  lat: Float!
  lng: Float!
  name: String!
}

type PostPayload {
  success: Boolean!
  message: String!
  data: Post
}

type PostsPayload {
  success: Boolean!
  message: String!
  data: [Post!]!
  total: Int!
  page: Int!
  limit: Int!
}

input CreatePostInput {
  title: String!
  text: String!
  photos: [Upload!]
  types: [String!]
  location: LocationInput
}

input UpdatePostInput {
  title: String
  text: String
  photos: [String!]
  types: [String!]
  location: LocationInput
}

input LocationInput {
  lat: Float!
  lng: Float!
  name: String!
}

type ImageUploadPayload {
  success: Boolean!
  message: String!
  url: String
  publicID: String
}

type CommentsPayload {
  success: Boolean!
  message: String!
  data: [Comment!]!
  total: Int!
  page: Int!
  limit: Int!
  hasMore: Boolean!
}

type CommentPayload {
  success: Boolean!
  message: String!
  data: Comment
}
