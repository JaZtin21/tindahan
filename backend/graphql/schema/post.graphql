# Post Schema - User Posts and Comments

extend type Query {
  posts(page: Int, limit: Int): PostsPayload
  post(id: ObjectID!): PostPayload
  myPosts(page: Int, limit: Int): PostsPayload
  postsNearLocation(lat: Float!, lng: Float!, radius: Float, page: Int, limit: Int): PostsPayload
}

extend type Mutation {
  createPost(input: CreatePostInput!): PostPayload!
  updatePost(id: ObjectID!, input: UpdatePostInput!): PostPayload!
  deletePost(id: ObjectID!): DeletePayload!
  likePost(id: ObjectID!): PostPayload!
  unlikePost(id: ObjectID!): PostPayload!
}

type Post {
  id: ObjectID!
  text: String!
  photos: [String!]!
  author: User!
  location: Location
  likes: Int!
  isLiked: Boolean!
  comments: [Comment!]!
  commentCount: Int!
  createdAt: Time!
  updatedAt: Time
}

type Comment {
  id: ObjectID!
  text: String!
  author: User!
  createdAt: Time!
  updatedAt: Time
}

type Location {
  lat: Float!
  lng: Float!
  name: String!
}

type PostPayload {
  success: Boolean!
  message: String!
  data: Post
}

type PostsPayload {
  success: Boolean!
  message: String!
  data: [Post!]!
  total: Int!
  page: Int!
  limit: Int!
}

input CreatePostInput {
  text: String!
  photos: [String!]
  location: LocationInput
}

input UpdatePostInput {
  text: String
  photos: [String!]
  location: LocationInput
}

input LocationInput {
  lat: Float!
  lng: Float!
  name: String!
}
