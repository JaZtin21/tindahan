# GraphQL Schema for Tindahan API

# Scalars
scalar Time
scalar ObjectID

# Enums
enum UserRole {
  CUSTOMER
  OWNER
  ADMIN
}

enum ShopStatus {
  ACTIVE
  INACTIVE
  SUSPENDED
}

enum BusinessType {
  SARI_SARI_STORE
  GROCERY
  CONVENIENCE_STORE
  MINI_MART
}

enum ItemStatus {
  ACTIVE
  INACTIVE
}

# Types
type User {
  id: ObjectID!
  name: String!
  email: String!
  phone: String
  role: UserRole!
  shops: [ObjectID!]
  createdAt: Time!
  updatedAt: Time
  isActive: Boolean!
}

type AuthResponse {
  user: User!
  accessToken: String!
  refreshToken: String!
}

type BusinessHours {
  openTime: String!
  closeTime: String!
  days: [String!]!
}

type PaymentMethods {
  cash: Boolean!
  gcash: Boolean!
  paymaya: Boolean!
  card: Boolean!
}

type DeliveryOptions {
  available: Boolean!
  radius: Float
  fee: Float
  minOrder: Float
}

type SocialMedia {
  facebook: String
  instagram: String
}

type ContactDetails {
  phone: String!
  email: String!
  address: String!
}

type Shop {
  id: ObjectID!
  name: String!
  location: String!
  coordinates: Coordinates!
  coverPhoto: String!
  otherPhotos: [String!]!
  businessHours: BusinessHours!
  businessType: BusinessType!
  paymentMethods: PaymentMethods!
  delivery: DeliveryOptions!
  socialMedia: SocialMedia!
  verification: Verification!
  contactDetails: ContactDetails!
  inventory: [Item!]!
  createdAt: Time!
  updatedAt: Time
  createdBy: ObjectID!
  status: ShopStatus!
}

type Coordinates {
  lat: Float!
  lng: Float!
}

type Verification {
  isVerified: Boolean!
  verifiedDate: Time
  verificationId: String
}

type Discount {
  percentage: Float
  validUntil: Time
}

type Item {
  id: ObjectID!
  name: String!
  price: Float!
  description: String!
  category: String!
  subCategory: String
  stock: Int!
  coverPhoto: String!
  otherPhotos: [String!]!
  sku: String
  barcode: String
  weight: Float
  unit: String
  expiryDate: Time
  supplier: String
  brand: String
  origin: String
  tags: [String!]!
  isActive: Boolean!
  discount: Discount
  createdAt: Time
  updatedAt: Time
  shopId: ObjectID!
}

# Input Types
input LoginInput {
  email: String!
  password: String!
}

input SignupInput {
  name: String!
  email: String!
  password: String!
  role: UserRole
}

input RefreshTokenInput {
  refreshToken: String!
}

input UpdateProfileInput {
  name: String
  phone: String
}

input BusinessHoursInput {
  openTime: String!
  closeTime: String!
  days: [String!]!
}

input PaymentMethodsInput {
  cash: Boolean!
  gcash: Boolean!
  paymaya: Boolean!
  card: Boolean!
}

input DeliveryOptionsInput {
  available: Boolean!
  radius: Float
  fee: Float
  minOrder: Float
}

input SocialMediaInput {
  facebook: String
  instagram: String
}

input ContactDetailsInput {
  phone: String!
  email: String!
  address: String!
}

input CreateShopInput {
  name: String!
  location: String!
  coordinates: CoordinatesInput!
  coverPhoto: String!
  otherPhotos: [String!]!
  businessHours: BusinessHoursInput!
  businessType: BusinessType!
  paymentMethods: PaymentMethodsInput!
  delivery: DeliveryOptionsInput!
  socialMedia: SocialMediaInput!
  contactDetails: ContactDetailsInput!
}

input CoordinatesInput {
  lat: Float!
  lng: Float!
}

input UpdateShopInput {
  name: String
  location: String
  coordinates: CoordinatesInput
  coverPhoto: String
  otherPhotos: [String!]
  businessHours: BusinessHoursInput
  businessType: BusinessType
  paymentMethods: PaymentMethodsInput
  delivery: DeliveryOptionsInput
  socialMedia: SocialMediaInput
  contactDetails: ContactDetailsInput
}

input DiscountInput {
  percentage: Float
  validUntil: Time
}

input CreateItemInput {
  name: String!
  price: Float!
  description: String!
  category: String!
  subCategory: String
  stock: Int!
  coverPhoto: String!
  otherPhotos: [String!]!
  sku: String
  barcode: String
  weight: Float
  unit: String
  expiryDate: Time
  supplier: String
  brand: String
  origin: String
  tags: [String!]!
  shopId: ObjectID!
  discount: DiscountInput
}

input UpdateItemInput {
  name: String
  price: Float
  description: String
  category: String
  subCategory: String
  stock: Int
  coverPhoto: String
  otherPhotos: [String!]
  sku: String
  barcode: String
  weight: Float
  unit: String
  expiryDate: Time
  supplier: String
  brand: String
  origin: String
  tags: [String!]
  discount: DiscountInput
}

# Filter and Search Inputs
input ShopSearchInput {
  query: String
  lat: Float
  lng: Float
  radius: Float
  category: String
  businessType: BusinessType
  status: ShopStatus
  page: Int
  limit: Int
}

input ProductSearchInput {
  query: String
  category: String
  minPrice: Float
  maxPrice: Float
  shopId: ObjectID
  isActive: Boolean
  page: Int
  limit: Int
}

# Response Types
type AuthPayload {
  success: Boolean!
  message: String!
  data: AuthResponse
}

type UserPayload {
  success: Boolean!
  message: String!
  data: User
}

type ShopPayload {
  success: Boolean!
  message: String!
  data: Shop
}

type ShopsPayload {
  success: Boolean!
  message: String!
  data: [Shop!]!
}

type ItemPayload {
  success: Boolean!
  message: String!
  data: Item
}

type ItemsPayload {
  success: Boolean!
  message: String!
  data: [Item!]!
}

type DeletePayload {
  success: Boolean!
  message: String!
}

# Queries
type Query {
  # Auth
  me: UserPayload

  # Users (Admin only)
  users(page: Int, limit: Int): [User!]!

  # Shops
  shop(id: ObjectID!): ShopPayload
  shops(input: ShopSearchInput): ShopsPayload
  myShops(page: Int, limit: Int): ShopsPayload

  # Products/Items
  item(id: ObjectID!): ItemPayload
  items(input: ProductSearchInput): ItemsPayload
  myItems(page: Int, limit: Int): ItemsPayload

  # Health Check
  health: String!
}

# Mutations
type Mutation {
  # Auth
  login(input: LoginInput!): AuthPayload!
  signup(input: SignupInput!): AuthPayload!
  refreshToken(input: RefreshTokenInput!): AuthPayload!

  # User Profile
  updateProfile(input: UpdateProfileInput!): UserPayload

  # Shop Management
  createShop(input: CreateShopInput!): ShopPayload!
  updateShop(id: ObjectID!, input: UpdateShopInput!): ShopPayload!
  deleteShop(id: ObjectID!): DeletePayload!

  # Product/Item Management
  createItem(input: CreateItemInput!): ItemPayload!
  updateItem(id: ObjectID!, input: UpdateItemInput!): ItemPayload!
  deleteItem(id: ObjectID!): DeletePayload!

  # Admin (Admin only)
  updateUserStatus(id: ObjectID!, isActive: Boolean!): UserPayload!
}

# Subscriptions (for future real-time features)
type Subscription {
  # Real-time inventory updates
  itemStockUpdates(shopId: ObjectID!): Item!
  
  # Real-time shop status updates
  shopStatusUpdates: Shop!
}
